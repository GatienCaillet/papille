<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papille · Wireframe A</title>
<link rel="stylesheet" href="wf.css">
<style>
  body[data-variant=a]{--acc:#2f5d46;--acc-soft:#e1ebe4;--r:16px;--rs:12px}
  .a-shell{display:grid;grid-template-columns:236px 1fr;min-height:840px;background:#f7f6f1}
  .a-side{padding:26px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
  .a-logo{font-size:24px;font-weight:720;letter-spacing:-.03em}
  .a-nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink2);font-size:14px}
  .a-nav.on{background:var(--acc-soft);color:var(--acc);font-weight:620}
  .a-nav em{margin-left:auto;font-style:normal;font-size:11px;background:var(--fill2);border-radius:6px;padding:1px 7px}
  .a-main{padding:32px 40px 40px;display:flex;flex-direction:column;gap:22px}
  .is-m .a-main{padding:6px 18px 24px;gap:18px}
  .is-m .a-shell{display:contents}
  .a-day{flex:1;border-radius:12px;background:var(--fill);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .a-day.on{background:var(--acc);color:#fff}
  .is-m .a-day{padding:6px 0;align-items:center}
  .a-kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .a-round{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--paper);font-size:20px}
  .a-round.big{width:70px;height:70px;font-size:26px}
</style>
</head>
<body data-variant="a" data-view="both">
<script src="wf.js"></script>
<script>
const TABS = [['recettes', 'Recettes'], ['decouvrir', 'Découvrir'], ['gouts', 'Goûts'], ['journal', 'Journal'], ['courses', 'Courses']];

const V = {
  key: 'a', letter: 'A', name: 'Tableau de bord',
  desc: 'Une app d’usage quotidien, rangée comme un carnet de bord : barre latérale sur ordinateur, barre d’onglets en bas sur téléphone, cartes douces et arrondies. Le journal et les courses sont aussi visibles que les recettes : on ouvre Papille pour planifier sa journée, pas seulement pour chercher un plat.',
  refs: ['Sprout (cooking-website-exemple3 et 4) : structure, cartes, jauges d’apports', 'Cookly (exemple5) : fiche recette en deux colonnes, portions ±, valeurs nutritionnelles'],
  moves: ['Barre latérale + encart « À surveiller » toujours visible', 'Bandeau de 7 jours en tuiles pour le journal', 'Jauges colorées par nutriment', 'Goûts en 4 colonnes façon tableau Kanban'],
  shell(html, m, tab) {
    if (m === 'm') return `<div class="a-main">${html}</div><nav class="tabbar">${TABS.map(([k, l]) => `<span class="${k === tab ? 'on' : ''}">${H.ic()}${l}</span>`).join('')}</nav>`;
    return `<div class="a-shell">
      <aside class="a-side">
        <div class="a-logo">papille</div>
        <p class="xs mut" style="margin-bottom:22px">Ce qui vous plaît, sans risque.</p>
        <p class="eyb" style="color:var(--mid);margin:0 0 4px 12px">Ma cuisine</p>
        ${TABS.map(([k, l]) => `<span class="a-nav ${k === tab ? 'on' : ''}">${H.ic()}${l}${k === 'courses' ? '<em>14</em>' : ''}</span>`).join('')}
        <div class="card accs p16 col g6" style="margin-top:auto">
          <span class="eyb">À surveiller · 7 j</span>
          <span class="h3">Vitamine D, fibres, fer</span>
          <span class="sm acc b">Voir le journal →</span>
        </div>
        <span class="a-nav ${tab === 'profil' ? 'on' : ''}" style="margin-top:8px"><span class="av" style="width:26px;height:26px">GC</span>Profil</span>
      </aside>
      <div class="a-main">${html}</div></div>`;
  },
};

// En-tête de page commun à la variante A
const head = (m, eyb, title, sub = '', action = '') => `
  <div class="row between top g16">
    <div class="col g4"><span class="eyb">${eyb}</span><h1 class="h1">${title}</h1>${sub ? `<p class="ink2 ${m === 'm' ? 'sm' : ''}">${sub}</p>` : ''}</div>
    ${m === 'd' ? action : `<span class="av">GC</span>`}
  </div>${m === 'm' && action ? `<div>${action}</div>` : ''}`;

const recCard = (r, m, i) => m === 'm'
  ? `<div class="card row g12 p8"><div style="width:92px" class="none">${H.img('1/1')}</div>
      <div class="col g4 fx"><span class="xs mut">${r.ty} · ${r.o}</span><span class="h3">${r.n}</span>
      <span class="sm mut">${r.t} min · ${r.k} kcal</span><span class="row g6 xs"><span class="fx">${H.bar(r.s)}</span><b class="acc">${r.s} %</b></span></div></div>`
  : `<div class="card" style="overflow:hidden"><div class="stack">${H.img('16/10', '', '')}<span class="bdg" style="position:absolute;left:10px;top:10px;background:#fff">${r.ty}</span></div>
      <div class="p16 col g6"><span class="xs mut">${r.o}</span><span class="h3">${r.n}</span>
      <div class="hr"></div><div class="row between sm"><span class="mut">${r.t} min · ${r.k} kcal</span><span class="row g6"><span style="width:60px">${H.bar(r.s)}</span><b class="acc">${r.s} %</b></span></div></div></div>`;

const screens = [
/* 01 ------------------------------------------------------------ */
{ id: 'connexion', title: 'Connexion et inscription', tab: null,
  notes: ['Supabase Auth : e-mail + mot de passe. Un seul formulaire, deux onglets.', 'À l’inscription : confirmation du mot de passe, puis on enchaîne sur le Profil (allergies d’abord).', 'La déconnexion est en bas de l’écran Profil.'],
  html: m => {
    const form = `<div class="col g16" style="${m === 'd' ? 'width:380px' : ''}">
      <div class="col g4"><span class="h1">Bon retour</span><span class="ink2">Vos goûts vous attendent.</span></div>
      <div class="row g8">${H.seg(['Connexion', 'Inscription'])} ${H.mk(1)}</div>
      <div><span class="lbl">E-mail</span>${H.field('vous@exemple.fr')}</div>
      <div><span class="lbl">Mot de passe</span>${H.field('••••••••<span class="ml sm">Afficher</span>')}</div>
      <span class="btn pri blk lg">Se connecter</span>
      <span class="sm mut tc">Pas encore de compte ? <b class="acc">Créer un compte</b> ${H.mk(2)}</span>
    </div>`;
    if (m === 'm') return `<div class="col g24 px20" style="padding-top:40px;flex:1"><div class="a-logo" style="font-size:22px;font-weight:720">papille</div>${H.img('16/10', 'photo plat')}${form}</div>`;
    return `<div class="grid c2" style="min-height:840px;gap:0"><div class="p24" style="background:#f7f6f1"><div class="col g16" style="height:100%"><div style="font-size:24px;font-weight:720">papille</div>${H.img('4/3', 'photo plat')}<p class="h2" style="max-width:20ch">Mangez ce que vous aimez. Sans jamais risquer ce que vous ne pouvez pas manger.</p></div></div>
      <div class="row center">${form}</div></div>`;
  } },

/* 02 ------------------------------------------------------------ */
{ id: 'profil', title: 'Profil', tab: 'profil',
  notes: ['Les 14 allergènes de l’UE, en puces à cocher.', 'Régimes : chacun ajoute ses règles d’exclusion (ex. Sans porc → lardons, gélatine porcine…).', 'Aliments interdits en texte libre, avec suggestions CIQUAL pour éviter les fautes.', 'Mifflin-St Jeor recalculé à chaque saisie, avec le détail du calcul.', 'Références par nutriment : la base des couleurs du journal.'],
  html: m => {
    const left = `
      <div class="card p20 col g12"><div class="row between"><span class="h2">Allergies ${H.mk(1)}</span><span class="sm mut">2 sur 14</span></div><div class="row wrap g6">${H.chips(D.allergens, D.allergensOn)}</div></div>
      <div class="card p20 col g12"><span class="h2">Régimes ${H.mk(2)}</span><div class="row wrap g6">${H.chips(D.regimes, D.regimesOn)}</div></div>
      <div class="card p20 col g12"><span class="h2">Aliments interdits ${H.mk(3)}</span>${H.field('Ajouter : céleri, kiwi…')}<div class="row wrap g6">${D.forbidden.map(f => `<span class="chip">${f} <span class="x">×</span></span>`).join('')}</div>
        <p class="xs mut">En cas d’allergie, vérifiez toujours l’étiquette : un produit peut contenir des traces.</p></div>`;
    const right = `
      <div class="card p20 col g12"><span class="h2">Mon corps</span>
        <div class="grid c2" style="gap:10px"><div><span class="lbl">Âge</span>${H.field('<b>29</b> ans')}</div><div><span class="lbl">Sexe</span>${H.seg(['Femme', 'Homme'])}</div>
        <div><span class="lbl">Poids</span>${H.field('<b>62</b> kg')}</div><div><span class="lbl">Taille</span>${H.field('<b>168</b> cm')}</div></div>
        <div><span class="lbl">Activité</span>${H.field('<b>' + D.body.act + '</b><span class="ml">▾</span>')}</div>
        <div class="card accs p16 col g4"><span class="eyb">Besoin quotidien ${H.mk(4)}</span><span style="font-size:32px;font-weight:720;letter-spacing:-.03em">2 114 <span class="sm mut" style="font-weight:500">kcal / jour</span></span><span class="xs ink2">Mifflin-St Jeor : 1 364 kcal au repos × 1,55 (activité)</span></div>
      </div>
      <div class="card p20 col g8"><span class="h2">Mes références ${H.mk(5)}</span>
        <table class="tbl">${D.refs.map(r => `<tr><td>${r[0]}</td><td class="tr b">${r[1]}</td></tr>`).join('')}</table></div>
      <span class="btn">Se déconnecter</span>`;
    return head(m, 'Réglages', 'Profil', 'Ce que vous ne mangez jamais, et ce dont votre corps a besoin.') +
      (m === 'd' ? `<div class="grid c2" style="align-items:start"><div class="col g16">${left}</div><div class="col g16">${right}</div></div>` : `<div class="col g16">${left}${right}</div>`);
  } },

/* 03 ------------------------------------------------------------ */
{ id: 'swipe', title: 'Swipe des goûts', tab: 'gouts',
  notes: ['Seuls les aliments et plats compatibles avec le profil apparaissent.', 'Glisser : droite = J’aime, gauche = Je n’aime pas, haut ou bas = Je ne sais pas. Ou les trois boutons.', '200 aliments de base, puis bascule vers tout CIQUAL (≈ 3 200).', 'Un plat aimé fait monter ses ingrédients principaux (voir Mes goûts).', 'Annuler la dernière réponse.'],
  html: m => {
    const card = `<div class="stack" style="width:${m === 'd' ? 360 : 290}px;margin:0 auto"><div class="swipe-ghost"></div>
      <div class="card" style="position:relative;overflow:hidden;box-shadow:0 14px 30px -16px rgba(0,0,0,.3)">${H.img('4/3', 'photo')}
      <div class="p16 col g4"><span class="row g6">${H.bdg('Plat', 'acc')}<span class="xs mut">Légumes cuisinés</span></span><span class="h2">Ratatouille</span><span class="sm mut">aubergine, courgette, poivron, tomate</span></div></div></div>`;
    const btns = `<div class="row center g16"><span class="col g4" style="align-items:center"><span class="a-round">✕</span><span class="xs">Je n’aime pas</span></span>
      <span class="col g4" style="align-items:center"><span class="a-round">?</span><span class="xs">Je ne sais pas</span></span>
      <span class="col g4" style="align-items:center"><span class="a-round big" style="background:var(--acc);color:#fff;border-color:var(--acc)">♥</span><span class="xs">J’aime</span></span> ${H.mk(2)}</div>`;
    const prog = `<div class="card soft p12 col g6"><div class="row between sm"><span><b>Base</b> · 48 sur 200 ${H.mk(3)}</span><span class="row g6">Tout CIQUAL ${H.tg(false)}</span></div>${H.bar(24)}</div>`;
    const stage = `${card}<div class="row center sm mut g6" style="margin-top:4px">← Je n’aime pas · ↑↓ Je ne sais pas · J’aime → ${H.mk(1)}</div>${btns}<div class="row center"><span class="btn sm soft">↶ Annuler ${H.mk(5)}</span></div>`;
    const last = `<div class="card p16 col g8"><span class="h3">Dernières réponses</span><div class="list">${[['Lentille corail', '♥', 'green'], ['Endive', '✕', 'red'], ['Fenouil', '?', ''], ['Hachis parmentier', '♥', 'green']].map(x => `<div class="row between p8"><span>${x[0]}</span>${H.bdg(x[1], x[2])}</div>`).join('')}</div>
      <p class="xs mut">Hachis parmentier aimé → pomme de terre +8, bœuf +8 ${H.mk(4)}</p></div>`;
    return head(m, 'Mes goûts', 'Vous aimez ?', 'Répondez à l’instinct.') + `<div style="max-width:320px">${H.seg(['Swiper', 'Mes listes'])}</div>` +
      (m === 'd' ? `<div class="grid" style="grid-template-columns:1fr 280px;align-items:start"><div class="col g16">${prog}${stage}</div>${last}</div>` : `${prog}${stage}`);
  } },

/* 04 ------------------------------------------------------------ */
{ id: 'mes-gouts', title: 'Mes goûts', tab: 'gouts',
  notes: ['Recherche CIQUAL : on classe un aliment directement dans une des 4 listes.', 'Quatre listes modifiables ; un aliment se déplace d’une liste à l’autre (glisser sur ordi, menu ⋯ sur téléphone).', 'Score de −100 à +100, détail au toucher : réponse directe + plats aimés + effet de groupe.', '« Inconnu » = tout ce qui n’a jamais été noté, trié par score prédit.'],
  html: m => {
    const search = `<div class="col g6" style="position:relative">${H.field('⌕ <b>pana</b>|')}
      <div class="card p8 row between" style="box-shadow:0 10px 24px -14px rgba(0,0,0,.3)"><span><b>Panais</b> <span class="xs mut">Légumes racines</span></span><span class="row g4"><span class="btn sm">♥</span><span class="btn sm">✕</span><span class="btn sm">?</span></span></div></div>`;
    const row = (f, open) => `<div class="col g4 p8"><div class="row between"><span>${f[0]}</span>${B.score(f[2])}</div>
      ${open ? `<div class="card soft p8 xs ink2">+50 aimé · +24 trois plats aimés · +8 groupe « ${f[1]} » ${H.mk(3)}</div>` : ''}</div>`;
    const lists = [['J’aime', D.likes], ['Je n’aime pas', D.dislikes], ['Je ne sais pas', D.unsure], ['Inconnu', D.unknown]];
    if (m === 'm') return head(m, 'Mes goûts', 'Mes listes') + H.seg(['Swiper', 'Mes listes'], 1) + search +
      `<div class="row g6 hscroll">${['J’aime 7', 'N’aime pas 4', 'Ne sais pas 3', 'Inconnu 2 841'].map((t, i) => `<span class="chip ${i ? '' : 'on'}">${t}</span>`).join('')} ${H.mk(2)}</div>
       <div class="card list">${D.likes.slice(0, 6).map((f, i) => row(f, i === 0)).join('')}</div>`;
    return head(m, 'Mes goûts', 'Mes listes', '', `<div style="width:360px">${search}</div>`) + `<div class="row g8">${H.seg(['Swiper', 'Mes listes'], 1)} ${H.mk(1)}</div>` +
      `<div class="a-kan">${lists.map(([t, l], i) => `<div class="card soft p12 col g8"><div class="row between"><span class="h3">${t}</span><span class="xs mut">${i === 3 ? '2 841' : l.length}</span></div>
        <div class="card list">${l.map((f, j) => row(f, i === 0 && j === 0)).join('')}</div>${i === 1 ? `<span class="xs mut">${H.mk(2)} glisser une carte pour la déplacer</span>` : ''}${i === 3 ? `<span class="xs mut">${H.mk(4)} trié par score prédit</span>` : ''}</div>`).join('')}</div>`;
  } },

/* 05 ------------------------------------------------------------ */
{ id: 'recettes', title: 'Recettes', tab: 'recettes',
  notes: ['Uniquement les recettes compatibles et sans aucun aliment « Je n’aime pas », triées par affinité.', 'Filtres : texte, temps, type de plat, origine, « que des aliments que j’aime ».', 'Les recettes impossibles à vérifier sont masquées ; un interrupteur les affiche.', 'Affichée quand même : bordure et bandeau rouges, raison précise.'],
  html: m => {
    const filters = `<div class="col g8">${H.field('⌕ Rechercher une recette, un ingrédient…')}
      <div class="row wrap g6"><span class="chip">⏱ ≤ 30 min ▾</span><span class="chip">Type ▾</span><span class="chip">Origine ▾</span><span class="chip on">♥ Que des aliments que j’aime</span> ${H.mk(2)}</div>
      <div class="row between sm"><span class="mut">Tri : selon vos goûts ${H.mk(1)}</span><span class="row g6">Non vérifiables (6) ${H.tg(true)} ${H.mk(3)}</span></div></div>`;
    const u = D.unverifiable;
    const unv = m === 'm'
      ? `<div class="card warn row g12 p8"><div style="width:92px" class="none">${H.img('1/1')}</div><div class="col g4 fx"><span class="bdg red">⚠ Impossible à vérifier ${H.mk(4)}</span><span class="h3">${u.n}</span><span class="xs red">${u.why}</span></div></div>`
      : `<div class="card warn" style="overflow:hidden">${H.img('16/10')}<div class="p16 col g6"><span class="bdg red">⚠ Impossible à vérifier ${H.mk(4)}</span><span class="h3">${u.n}</span><span class="xs red">${u.why}</span></div></div>`;
    return head(m, 'Pour vous', 'Recettes', '312 recettes compatibles avec votre profil.', `<span class="btn pri">＋ Ajouter une recette</span>`) + filters +
      `<div class="grid dc3">${D.recipes.slice(0, m === 'm' ? 4 : 5).map((r, i) => recCard(r, m, i)).join('')}${unv}</div>`;
  } },

/* 06 ------------------------------------------------------------ */
{ id: 'fiche-recette', title: 'Fiche recette', tab: 'recettes',
  notes: ['Avis sur le plat : J’aime / J’aime pas. Un avis met à jour le score des ingrédients principaux.', 'Portions ± : ingrédients et apports recalculés.', 'Repères par ingrédient : aimé, inconnu, composé (décomposé et vérifié).', 'Bloc sécurité : ce qui a été vérifié et contre quoi.', 'Envoie au journal (en portions) ou à la liste de courses (ajustée aux portions).'],
  html: m => {
    const ing = `<div class="col g8"><div class="card accs p12 row between"><span class="b acc">Ingrédients <span class="sm" style="font-weight:500">(pour 4)</span></span>${H.mk(3)}</div>
      <div class="list">${D.ingredients.map(i => `<div class="row between" style="padding:8px 2px"><span class="row g6">${i[0]} ${B.ingMark(i[2])}</span><span class="sm mut">${i[1]}</span></div>`).join('')}</div></div>`;
    const nut = `<div class="col g8"><div class="card accs p12 row between"><span class="b acc">Par portion</span><span class="xs mut">% de mon besoin</span></div>
      <div class="list">${D.nutriRecipe.map(n => `<div class="row between" style="padding:8px 2px"><span>${n[0]}</span><span class="row g12"><span class="sm">${n[1]}</span><span class="sm mut" style="width:36px;text-align:right">${n[2]} %</span></span></div>`).join('')}</div></div>`;
    const safe = `<div class="ok p12 col g4"><span class="b green">✓ Vérifiée pour votre profil ${H.mk(4)}</span><span class="sm ink2">8 ingrédients, dont 2 composés décomposés : pâte de curry (piment, ail, citronnelle, cumin…), bouillon (carotte, poireau, oignon, sel). Sans fruits à coque, sésame, porc, coriandre, kiwi.</span></div>`;
    const avis = `<div class="row g8"><span class="btn">♥ J’aime</span><span class="btn">✕ J’aime pas</span> ${H.mk(1)}</div>`;
    const actions = `<div class="row g8"><span class="btn pri fx">＋ Journal</span><span class="btn fx">＋ Courses</span> ${H.mk(5)}</div>`;
    const stepper = `<div class="row between"><span class="h3">Portions ${H.mk(2)}</span><span class="row g8"><span class="btn ic-only">−</span><b style="width:30px;text-align:center">4</b><span class="btn ic-only">＋</span></span></div>`;
    const steps = `<div class="col g12"><span class="h2">Étapes</span>${[1, 2, 3].map(n => `<div class="row top g12"><span class="av" style="background:var(--acc-soft);color:var(--acc)">${n}</span><div class="fx">${H.lines([100, 70])}</div></div>`).join('')}</div>`;
    const stats = `<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:0">${[['30', 'minutes'], ['520', 'kcal / portion'], ['94 %', 'pour vous']].map((s, i) => `<div class="col g4 tc" style="${i ? 'border-left:1px solid var(--line)' : ''}"><b style="font-size:20px">${s[0]}</b><span class="xs mut">${s[1]}</span></div>`).join('')}</div>`;
    if (m === 'm') return `<div class="row between"><span>←</span><span class="b">Recette</span><span>⋯</span></div>${H.img('4/3')}<div class="col g6">${H.bdg('Plat · Indienne', 'acc')}<span class="h1">Curry de lentilles corail</span><span class="sm mut">marmiton.org ↗</span></div>${stats}${avis}${safe}${stepper}${ing}${nut}${steps}<div class="card p12" style="position:sticky;bottom:0">${actions}</div>`;
    return `<div class="row sm mut">← Recettes</div><div class="grid c2" style="gap:32px;align-items:start">${H.img('4/3')}
      <div class="col g16">${H.bdg('Plat · Indienne', 'acc')}<span class="h1">Curry de lentilles corail</span><span class="sm mut">marmiton.org ↗</span>${stats}${avis}${safe}${actions}</div></div>
      <div class="card p24 col g16">${stepper}<div class="grid c2" style="gap:32px">${ing}${nut}</div></div>${steps}`;
  } },

/* 07 ------------------------------------------------------------ */
{ id: 'ajout-recette', title: 'Recherche web et ajout de recette', tab: 'recettes',
  notes: ['Les contraintes du profil sont ajoutées à la requête, visibles et retirables.', 'Sources cochables : Marmiton, 750g, Cuisine AZ…', 'Chaque résultat annonce ses aliments inconnus ou « je n’aime pas ».', 'Résultat non vérifiable : avertissement rouge, import possible mais il restera masqué par défaut.', 'Les résultats incompatibles sont retirés, avec le motif.', 'Aperçu : ingrédients analysés avant l’import.'],
  html: m => {
    const top = `${H.seg(['Chercher sur le web', 'Coller un lien', 'À la main'])}
      <div class="row g8"><div class="fx">${H.field('⌕ <b>lasagnes</b>')}</div><span class="btn pri">Chercher</span></div>
      <div class="col g6"><span class="xs mut">Ajouté à la requête ${H.mk(1)}</span><div class="row wrap g6">${D.webQuery.map(q => `<span class="chip sm">${q} <span class="x">×</span></span>`).join('')}</div></div>
      <div class="row wrap g6"><span class="xs mut">Sources ${H.mk(2)}</span>${H.chips(D.sources, D.sources.slice(0, 3), 'sm')}</div>`;
    const res = w => `<div class="card ${w.st === 'unv' ? 'warn' : ''} row top g12 p12"><div style="width:${m === 'd' ? 110 : 76}px" class="none">${H.img('1/1')}</div>
      <div class="col g6 fx"><span class="h3">${w.n}</span><span class="xs mut">${w.src}</span><div class="row wrap g4">${B.webBadges(w)}</div>${w.st === 'unv' ? `<span class="xs red">${w.info} ${H.mk(4)}</span>` : ''}</div>
      <span class="btn sm ${w.st === 'unv' ? '' : 'soft'}">Importer</span></div>`;
    const list = `<div class="col g8">${D.web.map(res).join('')}<span class="sm mut">3 résultats retirés : porc (2), noix de cajou (1) · <u>voir</u> ${H.mk(5)}</span></div>`;
    const preview = `<div class="card p20 col g12"><span class="eyb">Aperçu ${H.mk(6)}</span><span class="h2">Lasagnes végétariennes</span><span class="xs mut">marmiton.org · 6 portions · 70 min</span>
      <div class="list">${[['Feuilles de lasagne', 'like'], ['Ricotta', 'unknown'], ['Épinards', 'unknown'], ['Sauce tomate maison', 'comp'], ['Mozzarella', 'like']].map(i => `<div class="row between" style="padding:7px 0"><span>${i[0]}</span>${B.ingMark(i[1])}</div>`).join('')}</div>
      <span class="btn pri blk">Importer dans mes recettes</span></div>`;
    return head(m, 'Recettes', 'Ajouter une recette') + (m === 'd' ? `<div class="grid" style="grid-template-columns:1fr 360px;align-items:start;gap:24px"><div class="col g16">${top}${list}</div>${preview}</div>` : top + list);
  } },

/* 08 ------------------------------------------------------------ */
{ id: 'decouvrir', title: 'Découvrir', tab: 'decouvrir',
  notes: ['Aliments jamais notés mais proches de ce que vous aimez (même groupe, mêmes plats).', 'La raison est toujours affichée.', 'Réponse directe sur l’aliment : il quitte « Inconnu ».', 'Recettes pour goûter l’aliment sélectionné, chacune avec J’aime / J’aime pas.'],
  html: m => {
    const food = (f, i) => `<div class="card ${i === 0 ? '' : ''} col g8 p12" style="${i === 0 ? 'border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)' : ''};${m === 'm' ? 'width:230px' : ''}">${H.img('16/10')}
      <div class="row between"><span class="h3">${f.n}</span>${B.score(f.s)}</div><span class="xs mut">Parce que vous aimez ${f.why}${i === 0 ? ' ' + H.mk(2) : ''}</span>
      <div class="row g6"><span class="btn sm fx">♥</span><span class="btn sm fx">✕</span><span class="btn sm fx">Pas goûté</span></div></div>`;
    const recs = D.discoverRecipes.map(r => m === 'm'
      ? `<div class="card row g12 p8"><div style="width:84px" class="none">${H.img('1/1')}</div><div class="col g4 fx"><span class="h3">${r.n}</span><span class="xs mut">${r.t} min · ${r.k} kcal</span><span class="row g6"><span class="btn sm">♥ J’aime</span><span class="btn sm">✕</span></span></div></div>`
      : `<div class="card" style="overflow:hidden">${H.img('16/10')}<div class="p16 col g8"><span class="h3">${r.n}</span><span class="sm mut">${r.t} min · ${r.k} kcal</span><div class="row g6"><span class="btn sm fx">♥ J’aime</span><span class="btn sm fx">✕ J’aime pas</span></div></div></div>`).join('');
    return head(m, 'À goûter', 'Découvrir', 'Des aliments que vous n’avez jamais notés, proches de ce que vous aimez.') +
      `<div class="row g8"><span class="h2">Pour vous ${H.mk(1)}</span></div>
       <div class="${m === 'm' ? 'hscroll' : 'grid dc3'}">${D.discover.map(food).join('')}</div><span class="xs mut">${H.mk(3)} ♥ / ✕ classe l’aliment dans vos listes</span>
       <div class="row between"><span class="h2">Goûter le panais ${H.mk(4)}</span><span class="sm acc b">Tout voir</span></div>
       <div class="grid dc3">${recs}</div>`;
  } },

/* 09 ------------------------------------------------------------ */
{ id: 'journal', title: 'Journal et apports', tab: 'journal',
  notes: ['Un jour à la fois ; bandeau des 7 derniers jours.', 'Ajout : un aliment en grammes ou une recette en portions.', 'Tableau du jour ou moyenne sur 7 jours, couleur par nutriment.', 'À surveiller : sous 70 % du besoin (moyenne 7 j), avec aliments et recettes compatibles pour y remédier.'],
  html: m => {
    const week = `<div class="row g6 fx">${D.week.map((d, i) => `<div class="a-day ${i === 6 ? 'on' : ''}"><span class="xs" style="opacity:.75">${d[0]}</span><b style="font-size:${m === 'd' ? 20 : 15}px">${d[1]}</b></div>`).join('')}</div>`;
    const add = `<div class="card p16 col g8"><div class="row between"><span class="h3">Ajouter ${H.mk(2)}</span>${H.seg(['Aliment', 'Recette'])}</div>
      <div class="row g8"><div class="fx">${H.field('⌕ <b>Pomme</b>')}</div><div style="width:96px">${H.field('<b>150</b> g')}</div><span class="btn pri">＋</span></div></div>`;
    const entries = `<div class="card list">${D.journal.map(e => `<div class="row between p12"><span class="col" style="gap:0"><span>${e[0]}</span><span class="xs mut">${e[1]}</span></span><span class="row g12"><span class="sm">${e[2]} kcal</span><span class="mut">×</span></span></div>`).join('')}</div>`;
    const rows = D.nutri.map(r => B.nutriRow(r));
    const table = `<div class="card p20 col g12"><div class="row between"><span class="h2">Apports</span>${H.seg(['Jour', '7 jours'])} </div>
      <div class="col g4"><span style="font-size:30px;font-weight:720;letter-spacing:-.03em">1 640 <span class="sm mut" style="font-weight:500">/ 2 114 kcal</span></span>${H.bar(78, 'orange')}</div>
      <div class="col g8 mt8">${rows.slice(1).map(r => `<div class="col g4"><div class="row between sm"><span>${r.name}</span><span><b>${r.val}</b> <span class="mut">/ ${r.ref}</span></span></div>${H.bar(r.p, r.c)}</div>`).join('')}</div>${B.legend()} <span class="xs mut">${H.mk(3)}</span></div>`;
    const watch = `<div class="card p20 col g12" style="border-color:var(--red);background:var(--red-soft)"><div class="row between"><span class="h2">À surveiller ${H.mk(4)}</span><span class="xs mut">moyenne 7 j · sous 70 %</span></div>
      <div class="grid dc3" style="gap:12px">${D.watch.map(w => `<div class="card p12 col g6"><div class="row between"><b>${w.n}</b><span class="bdg red">${w.p} %</span></div><span class="xs mut">Aliments</span><span class="sm">${w.foods}</span><span class="xs mut">Recettes</span><span class="sm acc b">${w.recipes} →</span></div>`).join('')}</div></div>`;
    const date = `<div class="row between"><span class="btn sm soft">‹</span><b>Dimanche 15 novembre ${H.mk(1)}</b><span class="btn sm soft">›</span></div>`;
    if (m === 'm') return head(m, 'Journal', 'Aujourd’hui') + week + add + entries + table + watch;
    return head(m, 'Journal', 'Dimanche 15 novembre', '', `<div class="row g8"><span class="btn sm">‹</span><span class="btn sm">Aujourd’hui</span><span class="btn sm">›</span></div>`) + `<div class="row g6">${week} ${H.mk(1)}</div>` +
      `<div class="grid" style="grid-template-columns:1fr 380px;align-items:start;gap:24px"><div class="col g16">${add}${entries}</div>${table}</div>${watch}`;
  } },

/* 10 ------------------------------------------------------------ */
{ id: 'courses', title: 'Liste de courses', tab: 'courses',
  notes: ['Ingrédients d’une recette ajoutés, ajustés aux portions ; les doublons sont fusionnés (source indiquée).', 'Articles manuels.', 'Liste de base « toujours acheter », ajoutée en un geste.', 'Regroupement par rayon, cases à cocher.', 'Vider les articles cochés.'],
  html: m => {
    const prog = `<div class="card accs p12 col g6"><div class="row between sm"><b class="acc">✓ 3 sur 15 dans le panier</b><span class="acc">20 %</span></div>${H.bar(20)}</div>`;
    const actions = `<div class="row g8"><div class="fx">${H.field('＋ Ajouter un article…')}</div>${H.mk(2)}</div>
      <div class="row wrap g8"><span class="btn pri">＋ Toujours acheter (6) ${H.mk(3)}</span><span class="btn">Vider les cochés (3) ${H.mk(5)}</span></div>`;
    const groups = `<div class="col g16">${D.shopping.map(([g, items], gi) => `<div class="col g4"><div class="row between"><span class="eyb" style="color:var(--mid)">${g}${gi === 0 ? ' ' + H.mk(4) : ''}</span><span class="xs mut">${items.length}</span></div>
      <div class="list">${items.map(it => `<div class="row g12" style="padding:9px 2px">${H.cb(it[3])}<span class="fx ${it[3] ? 'strike' : ''}">${it[0]}${it[2] ? ` <span class="xs mut">· ${it[2]}</span>` : ''}</span><span class="sm mut">${it[1]}</span></div>`).join('')}</div></div>`).join('')}</div>`;
    const side = `<div class="col g16"><div class="card p16 col g8"><span class="h3">Depuis vos recettes ${H.mk(1)}</span>${[['Curry de lentilles corail', '4 portions'], ['Chili sin carne', '2 portions']].map(r => `<div class="row g12"><div style="width:44px" class="none">${H.img('1/1')}</div><span class="fx sm">${r[0]}</span><span class="xs mut">${r[1]}</span></div>`).join('')}<span class="xs mut">Oignon : 2 + 1 → 3 · Tomates : 2 + 1 → 3 boîtes</span></div>
      <div class="card p16 col g8"><div class="row between"><span class="h3">Toujours acheter</span><span class="sm acc b">Modifier</span></div><div class="row wrap g6">${H.chips(D.always, [], 'sm')}</div></div></div>`;
    return head(m, 'Cette semaine', 'Liste de courses') + (m === 'd' ? `<div class="grid" style="grid-template-columns:1fr 320px;gap:24px;align-items:start"><div class="col g16">${prog}${actions}${groups}</div>${side}</div>` : prog + actions + groups + side);
  } },
];

WF.render(V, screens);
</script>
</body>
</html>
