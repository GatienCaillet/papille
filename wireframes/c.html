<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papille · Wireframe C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wf.css">
<style>
  body[data-variant=c]{--acc:#56630f;--acc-soft:#eef0dc;--r:12px;--rs:10px;--serif:"Newsreader",Georgia,serif;--cmono:"JetBrains Mono",ui-monospace,monospace}
  .c-serif{font-family:var(--serif);font-weight:500;letter-spacing:-.015em}
  .c-h1{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.08;letter-spacing:-.02em}
  .is-d .c-h1{font-size:44px}
  .c-m{font-family:var(--cmono);font-size:11.5px;color:var(--mid);letter-spacing:.01em}
  .c-top{display:flex;align-items:baseline;gap:28px;padding:22px 56px;border-bottom:1px solid var(--line)}
  .c-top .c-serif{font-size:24px}
  .c-links{display:flex;gap:24px;margin-left:auto;font-size:14px;color:var(--ink2)}
  .c-links .on{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
  .c-col{width:100%;max-width:760px;margin:0 auto;padding:44px 0 56px;display:flex;flex-direction:column;gap:24px}
  .is-m .c-col{padding:12px 20px 28px;gap:20px}
  .c-nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:12px 4px 24px;margin-top:auto;font-size:12px;color:var(--mid);text-align:center}
  .c-nav .on{color:var(--ink);font-weight:600}
  .c-nav .on::before{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin:0 auto 5px}
  .c-nav span:not(.on)::before{content:"";display:block;height:5px;margin-bottom:5px}
  .lt{flex:none;display:grid;place-items:center;background:#f1ece2;border-radius:var(--rs);font-family:var(--serif);font-style:italic;color:#9a9284}
  .c-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .c-pill{display:flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:999px;background:#f3f2ee;font-weight:620;font-size:14px;flex:1;text-align:center}
  .is-m .c-pill{padding:12px 8px;font-size:13px;white-space:nowrap}
  .c-pill.pri{background:var(--acc);color:#fff}
  .c-pill.out{background:#fff;border:1px solid var(--line)}
  .c-prog{display:flex;gap:6px}.c-prog i{flex:1;height:3px;border-radius:2px;background:var(--fill2)}.c-prog i.on{background:var(--ink)}
  .c-opt{border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px}
  .c-rule{border-left:2px solid var(--red);padding-left:14px}
  .c-code{font-family:var(--cmono);font-size:12px;background:#f6f4ee;border-radius:8px;padding:10px 12px;color:var(--ink2);line-height:1.6}
  .c-num{font-family:var(--serif);font-size:30px;color:var(--mid);line-height:1}
  .c-tabs{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--serif);font-size:19px;color:var(--mid)}
  .c-tabs .on{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
  .is-m .c-tabs{font-size:16px;gap:12px}
</style>
</head>
<body data-variant="c" data-view="both">
<script src="wf.js"></script>
<script>
const LINKS = [['recettes', 'Recettes'], ['decouvrir', 'Découvrir'], ['gouts', 'Goûts'], ['journal', 'Journal'], ['courses', 'Courses']];

const V = {
  key: 'c', letter: 'C', name: 'Carnet éditorial',
  desc: 'Calme et lisible, comme un carnet : titres serif, métadonnées en police à chasse fixe, presque pas d’images (une initiale en attendant les photos), une seule colonne centrée même sur grand écran. Tout est du texte qu’on lit et qu’on touche, en lignes. C’est la plus rapide à construire et la plus robuste sans photos ; le premier lancement se fait en étapes guidées.',
  refs: ['Bouchée (captures 1 à 7) : étapes numérotées, serif, pastilles, boutons pleine largeur, carte à initiale', 'Sprout (exemple4) : liste de courses en lignes cochables, sections par rayon'],
  moves: ['Colonne unique de 760 px, beaucoup d’air', 'Métadonnées en mono (« 30 MIN · PLAT · INDIENNE »)', 'Initiale serif à la place des photos manquantes', 'Saisie rapide en une ligne dans le journal (« pomme 150 g »)', 'Requête web montrée telle quelle, en clair'],
  shell(html, m, tab) {
    if (m === 'm') return `<div class="c-col">${html}</div><nav class="c-nav">${LINKS.map(([k, l]) => `<span class="${k === tab ? 'on' : ''}">${l}</span>`).join('')}</nav>`;
    return `<header class="c-top"><span class="c-serif">Papille</span><span class="c-m">dim. 15 nov.</span><nav class="c-links">${LINKS.map(([k, l]) => `<span class="${k === tab ? 'on' : ''}">${l}</span>`).join('')}<span class="${tab === 'profil' ? 'on' : ''}">Profil</span></nav></header><div class="c-col">${html}</div>`;
  },
};

const lt = (t, s = 48) => `<span class="lt" style="width:${s}px;height:${s}px;font-size:${s * .45}px">${t[0]}</span>`;
const head = (m, meta, title, sub = '') => `<div class="col g6">${meta ? `<span class="c-m">${meta}</span>` : ''}<h1 class="c-h1">${title}</h1>${sub ? `<p class="ink2">${sub}</p>` : ''}</div>`;
const avatar = m => m === 'm' ? `<div class="row between"><span class="c-serif" style="font-size:20px">Papille</span><span class="sm ink2">Profil</span></div>` : '';

const screens = [
/* 01 */
{ id: 'connexion', title: 'Connexion et inscription', tab: null,
  notes: ['Supabase Auth : e-mail + mot de passe ; un lien bascule vers l’inscription.', 'Après l’inscription : premier lancement en 4 étapes (écran suivant).', 'Déconnexion : en bas du Profil.'],
  html: m => `<div class="col g24" style="width:${m === 'd' ? '400px' : '100%'};margin:${m === 'd' ? '120px auto' : '0'};padding:${m === 'd' ? 0 : '48px 22px'}">
    <div class="col g6"><span class="c-m">papille · v1</span><span class="c-h1" style="font-size:48px">Papille</span><p class="ink2">Ce que vous aimez, sans jamais risquer le reste.</p></div>
    <div class="col g12"><div><span class="lbl">E-mail</span>${H.field('vous@exemple.fr')}</div><div><span class="lbl">Mot de passe</span>${H.field('••••••••')}</div></div>
    <span class="c-pill pri">Se connecter ${H.mk(1)}</span><span class="c-pill out">Créer un compte</span>
    <p class="c-m">Vos données restent dans votre compte. ${H.mk(2)}</p></div>` },

/* 02 */
{ id: 'premier-lancement', title: 'Premier lancement (étapes)', tab: null,
  notes: ['Quatre étapes courtes : 1 interdits, 2 corps, 3 swipe de 20 cartes, 4 récapitulatif. On peut passer les étapes 2 et 3.', 'L’allergie passe toujours en premier : rien n’est proposé avant cette étape.', 'Mention de prudence sur les traces, comme sur un emballage.'],
  html: m => `<div class="col g20" style="width:100%;max-width:640px;margin:0 auto;padding:${m === 'd' ? '48px 0' : '16px 20px 28px'}">
    <div class="c-prog"><i class="on"></i><i></i><i></i><i></i></div><span class="c-m">Étape 1 sur 4 · 30 secondes ${H.mk(1)}</span>
    <h1 class="c-h1">Ce que vous ne mangez jamais</h1><p class="ink2">Allergies, régimes, interdits. Ces aliments ne seront jamais proposés, ni dans une recette, ni dans une découverte. ${H.mk(2)}</p>
    <div class="col g8"><b>Allergies</b><div class="row wrap g6">${H.chips(D.allergens, D.allergensOn)}</div></div>
    <div class="col g8"><b>Régimes</b><div class="row wrap g6">${H.chips(D.regimes, D.regimesOn)}</div></div>
    <div class="col g8"><b>Autre aliment interdit</b>${H.field('Rechercher : céleri, kiwi…')}</div>
    <p class="xs mut">En cas d’allergie, vérifiez toujours l’étiquette : un produit peut contenir des traces que la recette ne connaît pas. ${H.mk(3)}</p>
    <span class="c-pill pri">Continuer</span></div>` },

/* 03 */
{ id: 'profil', title: 'Profil', tab: 'profil',
  notes: ['Le même contenu que les étapes, en sections numérotées, modifiable à tout moment.', 'Corps : le calcul Mifflin-St Jeor est écrit en toutes lettres.', 'Références par nutriment en tableau mono.'],
  html: m => {
    const sec = (n, t, inner) => `<div class="col g12" style="padding-top:8px;border-top:1px solid var(--line)"><div class="row g12"><span class="c-m">${n}</span><span class="c-serif" style="font-size:22px">${t}</span></div>${inner}</div>`;
    return avatar(m) + head(m, 'Réglages', 'Profil') + `<span class="xs mut">${H.mk(1)} modifiable à tout moment</span>` +
      sec('01', 'Allergies', `<div class="row wrap g6">${H.chips(D.allergens, D.allergensOn)}</div>`) +
      sec('02', 'Régimes', `<div class="row wrap g6">${H.chips(D.regimes, D.regimesOn)}</div>`) +
      sec('03', 'Interdits', `${H.field('Ajouter un aliment')}<div class="row g6">${D.forbidden.map(f => `<span class="chip">${f} <span class="x">×</span></span>`).join('')}</div>`) +
      sec('04', 'Votre corps', `<div class="grid ${m === 'd' ? 'dc4' : 'c2'}" style="gap:10px"><div><span class="lbl">Âge</span>${H.field('<b>29</b>')}</div><div><span class="lbl">Sexe</span>${H.seg(['Femme', 'Homme'])}</div><div><span class="lbl">Poids</span>${H.field('<b>62</b> kg')}</div><div><span class="lbl">Taille</span>${H.field('<b>168</b> cm')}</div></div>
        <div class="col g6">${['Sédentaire', 'Légère', 'Modérée · 3 à 5 séances', 'Intense'].map((a, i) => `<div class="c-opt row between" style="${i === 2 ? 'border-color:var(--ink)' : ''}"><span>${a}</span>${i === 2 ? '●' : '○'}</div>`).join('')}</div>
        <p class="c-serif" style="font-size:20px">Votre besoin : <b>2 114 kcal</b> par jour. ${H.mk(2)}</p><p class="c-m">(10 × 62) + (6,25 × 168) − (5 × 29) − 161 = 1 364 kcal × 1,55</p>`) +
      sec('05', 'Vos références', `<table class="tbl">${D.refs.map(r => `<tr><td>${r[0]}</td><td class="tr c-m" style="color:var(--ink)">${r[1]}</td></tr>`).join('')}</table><span class="xs mut">${H.mk(3)}</span>`) +
      `<span class="c-pill out" style="flex:none">Se déconnecter</span>`;
  } },

/* 04 */
{ id: 'swipe', title: 'Swipe des goûts', tab: 'gouts',
  notes: ['Carte simple : initiale (ou photo), nom, ingrédients. Uniquement des cartes compatibles.', 'Gauche : je n’aime pas · droite : j’aime · haut ou bas : je ne sais pas. Ou les trois boutons.', '200 aliments de base, puis bascule vers tout CIQUAL.'],
  html: m => `<div class="c-prog">${'<i class="on"></i>'.repeat(1)}${'<i></i>'.repeat(4)}</div><div class="row between"><span class="c-m">Base · 48 / 200 ${H.mk(3)}</span><span class="row g6 sm">Tout CIQUAL ${H.tg(false)}</span></div>
    <div class="col g4 tc" style="align-items:center"><h1 class="c-h1">Vous aimez ?</h1><p class="ink2">Répondez à l’instinct : chaque réponse affine la suivante.</p></div>
    <div class="card" style="width:${m === 'd' ? 320 : 280}px;margin:${m === 'd' ? '40px' : '24px'} auto;overflow:hidden;box-shadow:0 10px 30px -18px rgba(0,0,0,.3)"><div class="lt" style="width:100%;height:${m === 'd' ? 220 : 190}px;border-radius:0;font-size:34px">R</div>
      <div class="p16 col g4"><span class="c-serif" style="font-size:20px">Ratatouille ${H.mk(1)}</span><span class="sm mut">aubergine, courgette, poivron, tomate</span></div></div>
    <p class="sm mut tc">Glissez la carte (gauche : non, haut ou bas : je ne sais pas, droite : oui) ${H.mk(2)}</p>
    <div class="row g8"><span class="c-pill">Je n’aime pas</span><span class="c-pill">Je ne sais pas</span><span class="c-pill pri">J’aime</span></div>` },

/* 05 */
{ id: 'mes-gouts', title: 'Mes goûts', tab: 'gouts',
  notes: ['Quatre listes en onglets ; « Inconnu » se trie par score prédit.', 'Ajout direct par recherche.', 'Score en clair : d’où vient chaque point.', 'Déplacer un aliment d’une liste à l’autre.'],
  html: m => {
    const row = (f, open) => `<div class="c-row" style="${open ? 'border-bottom:0;padding-bottom:4px' : ''}">${lt(f[0], 40)}<div class="col fx" style="gap:0"><span class="c-serif" style="font-size:17px">${f[0]}</span><span class="c-m">${f[1]}</span></div><span class="c-m" style="color:${f[2] > 0 ? 'var(--green)' : 'var(--red)'};font-size:13px">${f[2] > 0 ? '+' : ''}${f[2]}</span><span class="mut">⋯</span></div>
      ${open ? `<div class="c-code" style="margin:0 0 6px 54px">+50 vous l’aimez<br>+24 trois plats aimés en contiennent<br>+8 groupe « légumes racines »<br><span style="color:var(--acc)">Déplacer vers : je n’aime pas · je ne sais pas</span> ${H.mk(4)}</div>` : ''}`;
    return `<div class="row g8 ${m === 'd' ? '' : ''}"><span class="sm" style="color:var(--mid)">Swiper</span><span class="sm b" style="text-decoration:underline;text-underline-offset:5px">Mes listes</span></div>` + head(m, '', 'Mes goûts') +
      `<div class="c-tabs"><span class="on">J’aime 7</span><span>Je n’aime pas 4</span><span>Je ne sais pas 3</span><span>Inconnu 2 841</span> ${H.mk(1)}</div>
       <div class="row g8"><div class="fx">${H.field('⌕ Ajouter un aliment : panais…')}</div>${H.mk(2)}</div>
       <div>${D.likes.slice(0, 6).map((f, i) => row(f, i === 0)).join('')}</div><span class="xs mut">${H.mk(3)} score de −100 à +100</span>`;
  } },

/* 06 */
{ id: 'recettes', title: 'Recettes', tab: 'recettes',
  notes: ['Liste en lignes, triée selon vos goûts ; le score d’affinité à droite.', 'Filtres en une ligne : texte, temps, type, origine, que des aliments aimés.', 'Aucune recette avec un aliment « je n’aime pas ».', 'Non vérifiables cachées ; si on les affiche : filet et texte rouges, raison en clair.'],
  html: m => {
    const row = r => `<div class="c-row">${lt(r.n, m === 'd' ? 64 : 52)}<div class="col fx" style="gap:2px"><span class="c-serif" style="font-size:${m === 'd' ? 20 : 17}px">${r.n}</span><span class="c-m">${r.t} MIN · ${r.ty.toUpperCase()} · ${r.o.toUpperCase()}</span></div><span class="col tr" style="gap:0"><span class="c-serif" style="font-size:20px">${r.s}</span><span class="c-m">%</span></span></div>`;
    const u = D.unverifiable;
    return avatar(m) + `<div class="row between top">${head(m, '312 compatibles', 'Recettes')}<span class="sm acc b" style="margin-top:${m === 'd' ? 30 : 22}px">＋ Ajouter</span></div>
      ${H.field('⌕ Nom, ingrédient…')}
      <div class="row wrap g6"><span class="chip sm">≤ 30 min</span><span class="chip sm">Plat</span><span class="chip sm">Origine</span><span class="chip sm on">Que des aliments aimés</span> ${H.mk(2)}</div>
      <div class="row between c-m"><span>TRI : SELON VOS GOÛTS ${H.mk(1)}</span><span>${H.mk(3)}</span></div>
      <div>${D.recipes.slice(0, m === 'd' ? 6 : 5).map(row).join('')}
        <div class="c-row c-rule" style="border-bottom-color:var(--line)">${lt(u.n, m === 'd' ? 64 : 52)}<div class="col fx" style="gap:2px"><span class="c-serif red" style="font-size:${m === 'd' ? 20 : 17}px">⚠ ${u.n}</span><span class="xs red">Impossible à vérifier : ${u.why} ${H.mk(4)}</span></div></div></div>
      <span class="sm ink2 tc">6 recettes non vérifiables masquées · <u>les afficher</u></span>`;
  } },

/* 07 */
{ id: 'fiche-recette', title: 'Fiche recette', tab: 'recettes',
  notes: ['Avis : J’aime / J’aime pas, en haut.', 'Ce qui a été vérifié, en une phrase.', 'Portions : tout se recalcule ; repères (aimé), (inconnu), (composé, vérifié).', 'Étapes en grands chiffres serif.', 'Ajouter au journal ou aux courses.'],
  html: m => `<span class="c-m">← RECETTES</span>
    <div class="col g6"><span class="c-m">30 MIN · PLAT · INDIENNE · MARMITON.ORG ↗</span><h1 class="c-h1">Curry de lentilles corail</h1><p class="ink2">520 kcal par portion · 94 % pour vous</p></div>
    <div class="row g8"><span class="c-pill out">J’aime</span><span class="c-pill out">J’aime pas</span>${H.mk(1)}</div>
    <p class="green sm c-rule" style="border-color:var(--green)">✓ Vérifiée : pâte de curry et bouillon décomposés. Ni fruits à coque, ni sésame, ni porc, ni coriandre, ni kiwi. ${H.mk(2)}</p>
    <div class="${m === 'd' ? 'grid dc2' : 'col g20'}" style="gap:40px;${m === 'd' ? 'align-items:start' : ''}">
      <div class="col g8"><div class="row between"><span class="c-serif" style="font-size:22px">Ingrédients</span><span class="row g8"><span class="btn sm ic-only" style="width:30px;height:30px">−</span><span class="c-m" style="color:var(--ink)">4 PORTIONS</span><span class="btn sm ic-only" style="width:30px;height:30px">＋</span>${H.mk(3)}</span></div>
        <div>${D.ingredients.map(i => `<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${i[0]} <span class="xs mut">${i[2] === 'like' ? '(aimé)' : i[2] === 'unknown' ? '(inconnu)' : i[2] === 'comp' ? '(composé, vérifié)' : ''}</span></span><span class="c-m" style="color:var(--ink)">${i[1]}</span></div>`).join('')}</div></div>
      <div class="col g8"><span class="c-serif" style="font-size:22px">Par portion</span><table class="tbl">${D.nutriRecipe.map(n => `<tr><td>${n[0]}</td><td class="tr c-m" style="color:var(--ink)">${n[1]}</td><td class="tr c-m">${n[2]} %</td></tr>`).join('')}</table></div></div>
    <div class="col g16"><span class="c-serif" style="font-size:22px">Préparation ${H.mk(4)}</span>${[1, 2, 3].map(n => `<div class="row top g16"><span class="c-num">${n}</span><div class="fx">${H.lines([100, 88, 40])}</div></div>`).join('')}</div>
    <div class="row g8"><span class="c-pill pri">Ajouter au journal</span><span class="c-pill">Aux courses</span>${H.mk(5)}</div>` },

/* 08 */
{ id: 'ajout-recette', title: 'Recherche web et ajout de recette', tab: 'recettes',
  notes: ['La requête réellement envoyée est affichée : contraintes du profil comprises.', 'Sources cochables.', 'Chaque résultat dit ce qu’il contient d’inconnu ou de « je n’aime pas ».', 'Non vérifiable : en rouge ; importable mais masqué par défaut ensuite.', 'Autres façons d’ajouter : coller un lien, saisir à la main.'],
  html: m => `${head(m, 'Recettes · ajouter', 'Chercher une recette')}
    <div class="row g8"><div class="fx">${H.field('⌕ <b>lasagnes</b>')}</div><span class="btn dark">Chercher</span></div>
    <div class="col g6"><span class="c-m">REQUÊTE ENVOYÉE ${H.mk(1)}</span><div class="c-code">lasagnes ${D.webQuery.join(' ')}<br>site:marmiton.org OR site:750g.com OR site:cuisineaz.com</div></div>
    <div class="row wrap g6"><span class="c-m">SOURCES ${H.mk(2)}</span>${H.chips(D.sources, D.sources.slice(0, 3), 'sm')}</div>
    <div>${D.web.map(w => `<div class="c-row ${w.st === 'unv' ? 'c-rule' : ''}" style="align-items:flex-start">${lt(w.n, 44)}<div class="col fx" style="gap:3px"><span class="c-serif ${w.st === 'unv' ? 'red' : ''}" style="font-size:18px">${w.st === 'unv' ? '⚠ ' : ''}${w.n}</span><span class="c-m">${w.src.toUpperCase()}</span>
      <span class="sm ${w.st === 'unv' ? 'red' : w.st === 'dislike' ? 'orange' : 'green'}">${w.st === 'unv' ? 'Impossible à vérifier : ' + w.info + ' ' + H.mk(4) : w.st === 'dislike' ? 'Compatible · contient ' + w.info.replace('1 je n’aime pas : ', '') + ' (je n’aime pas) ' + H.mk(3) : 'Compatible' + (w.info ? ' · ' + w.info : '')}</span></div><span class="sm b acc">Importer</span></div>`).join('')}</div>
    <p class="sm mut">3 résultats retirés : porc (2), noix de cajou (1).</p>
    <div class="row g8"><span class="c-pill out">Coller un lien</span><span class="c-pill out">Saisir à la main</span>${H.mk(5)}</div>` },

/* 09 */
{ id: 'decouvrir', title: 'Découvrir', tab: 'decouvrir',
  notes: ['Trois aliments inconnus proches de vos goûts, la raison en une phrase.', 'Réponse directe sur l’aliment.', 'Des recettes pour le goûter, chacune notée ♥ / ✕.'],
  html: m => `${avatar(m)}${head(m, 'À goûter', 'Et si vous goûtiez…', 'Des aliments jamais notés, proches de ce que vous aimez.')}
    <div>${D.discover.map((f, i) => `<div class="c-row" style="align-items:flex-start">${lt(f.n, 56)}<div class="col fx g6"><div class="row between"><span class="c-serif" style="font-size:21px">${f.n}</span><span class="c-m green">+${f.s}</span></div><span class="sm ink2">Parce que vous aimez ${f.why}. ${i === 0 ? H.mk(1) : ''}</span>
